<style>
/* Layout: one-thumb phone app. A sea-chart header with the live weather dial, then stacked screens; the buoy-orange accent marks the one thing to do next. */
:root{
  --bg:#eef3f2; --surface:#ffffff; --surface2:#e2ebea; --fg:#0f2328; --muted:#56706f; --line:#cfdcda;
  --sea:#0c4b5a; --sea2:#0a3440; --buoy:#e8601c; --buoy-ink:#ffffff; --good:#1f8a4c; --warn:#b7791f; --bad:#c2402a;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081a1f; --surface:#0f262d; --surface2:#15323a; --fg:#e4efee; --muted:#93acab; --line:#21424b;
  --sea:#0e5466; --sea2:#062229; --buoy:#ff7a33; --buoy-ink:#1a0d05; --good:#4cc47f; --warn:#e3b04f; --bad:#f07a63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081a1f; --surface:#0f262d; --surface2:#15323a; --fg:#e4efee; --muted:#93acab; --line:#21424b;
  --sea:#0e5466; --sea2:#062229; --buoy:#ff7a33; --buoy-ink:#1a0d05; --good:#4cc47f; --warn:#e3b04f; --bad:#f07a63; color-scheme:dark}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
html,body{margin:0;width:100%;overflow-x:hidden}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea2)}
button{font:inherit;color:inherit}
.wrap{width:100%;max-width:720px;min-height:100dvh;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(32px + env(safe-area-inset-bottom,0px))}
/* header */
.top{background:linear-gradient(180deg,var(--sea2),var(--sea));color:#eaf6f5;border-radius:0 0 24px 24px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:auto 0 0 0;height:22px;opacity:.18;background:repeating-radial-gradient(circle at 50% 160%,transparent 0 10px,#fff 10px 11px,transparent 11px 22px)}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand .nm{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--display);font-weight:800;font-size:1.9rem;letter-spacing:.02em;margin:0;line-height:1}
.brand h1 b{color:#ffb38a;font-weight:800}
.iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:7px 10px;color:#eaf6f5;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.85rem}
.iconbtn:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.loc{font-size:.85rem;opacity:.85;margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wx{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:12px}
.dial{width:clamp(100px,30vw,150px);height:auto;aspect-ratio:1}
.dial text{font-family:var(--mono);font-size:9px;fill:#cfe7e5}
.wxgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;min-width:0}
.wxv{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.05}
.wxl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.wxv small{font-family:var(--body);font-size:.75rem;font-weight:400;opacity:.85}
.phase{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-size:.8rem}
/* screens */
.screen{display:flex;flex-direction:column;gap:16px;margin-top:18px}
h2{font-family:var(--display);font-size:1.5rem;margin:0;line-height:1.1;text-wrap:balance}
h3{font-family:var(--display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{border:0;border-radius:14px;padding:16px 18px;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.03em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.primary{background:var(--buoy);color:var(--buoy-ink)}
.btn.sea{background:var(--sea);color:#eaf6f5}
.btn.ghost{background:var(--surface2);color:var(--fg);font-size:1.05rem;padding:12px}
.btn.good{background:var(--good);color:#fff}
.btn.small{font-size:1rem;padding:11px 12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.big{display:grid;gap:12px}
.bigbtn{display:grid;grid-template-columns:72px 1fr;min-height:110px;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;border:0;cursor:pointer}
.bigbtn .t{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.bigbtn .s{font-size:.88rem;opacity:.9}
.bigbtn.a{background:var(--buoy);color:var(--buoy-ink)}
.bigbtn.b{background:var(--sea);color:#eaf6f5}
.links{display:flex;gap:10px}
.links button{flex:1}
/* selectors */
.sel{display:flex;flex-direction:column;gap:8px}
.sel .lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sel .lbl span{font-weight:700}
.sel .lbl em{font-style:normal;font-size:.75rem;color:var(--muted);font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:.95rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:#eaf6f5}
.chip .auto{font-family:var(--mono);font-size:.62rem;background:var(--buoy);color:var(--buoy-ink);border-radius:4px;padding:0 4px}
.compass{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:220px}
.compass .chip{justify-content:center;padding:8px 0}
.note{font-size:.85rem;color:var(--muted)}
/* suggestion */
.sug{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.sug .hd{background:var(--surface2);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.step{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.zone{font-family:var(--mono);font-size:.72rem;background:var(--sea);color:#eaf6f5;border-radius:6px;padding:2px 7px}
.lureart{display:flex;justify-content:center;padding:6px 0 0}
.lureart svg{width:min(320px,90%);height:auto}
.sug .bd{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.lname{font-family:var(--display);font-size:1.75rem;font-weight:800;line-height:1.02;text-wrap:balance}
.lmaker{color:var(--muted);font-size:.9rem}
.colour{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:8px 10px}
.sw{width:34px;height:34px;border-radius:9px;flex:none;border:1px solid var(--line)}
.colour b{display:block}
.colour small{color:var(--muted)}
.tech{font-family:var(--display);font-size:1.2rem;font-weight:700;color:var(--buoy)}
ol.how{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.why{display:flex;flex-wrap:wrap;gap:6px}
.why span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.casts{display:flex;gap:8px;align-items:center;font-weight:700}
.depthbar{display:flex;flex-direction:column;gap:2px;width:28px;flex:none}
.depthbar i{height:9px;border-radius:3px;background:var(--surface2)}
.depthbar i.on{background:var(--buoy)}
.actions{display:grid;gap:10px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.tried{display:flex;flex-direction:column;gap:6px}
.tried div{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.tried .sw{width:16px;height:16px;border-radius:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--good);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem}
.boxlist{display:flex;flex-direction:column;gap:8px}
.boxrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.boxrow .txt{flex:1;min-width:0}
.boxrow .txt small{display:block;color:var(--muted)}
.boxrow.lost{opacity:.5}
.boxrow.lost .txt b{text-decoration:line-through}
.mini svg{width:70px;height:auto}
.boxrow{cursor:pointer}
.tg{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.tg:checked{background:var(--good)}
.tg:checked::after{transform:translateX(18px)}
.tg:disabled{opacity:.4}
.tg:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.sel .lbl h3{margin:0}
.tag{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.moon{display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700}
@media (prefers-reduced-motion:no-preference){.sug{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}

async function getWeather(lat,lon){
  const f=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,cloud_cover,precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&hourly=wind_speed_10m&forecast_hours=4&daily=sunrise,sunset&forecast_days=1&timezone=auto&wind_speed_unit=kmh`;
  const m=`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,wave_period,sea_surface_temperature&timezone=auto`;
  const [a,b]=await Promise.allSettled([fetch(f).then(r=>r.ok?r.json():Promise.reject(r.status)),fetch(m).then(r=>r.ok?r.json():Promise.reject(r.status))]);
  if(a.status!=="fulfilled") throw new Error("weather");
  const j=a.value,cu=j.current;
  const hs=(j.hourly&&j.hourly.wind_speed_10m)||[];
  const trend=hs.length>2?(hs[hs.length-1]-hs[0]):0;
  const out={temp:cu.temperature_2m,code:cu.weather_code,cloud:cu.cloud_cover,precip:cu.precipitation,wind:cu.wind_speed_10m,dir:cu.wind_direction_10m,gust:cu.wind_gusts_10m,isDay:cu.is_day,now:cu.time,sunrise:j.daily.sunrise[0],sunset:j.daily.sunset[0],trend};
  if(b.status==="fulfilled"&&b.value.current&&b.value.current.wave_height!=null){const mc=b.value.current;out.wave=mc.wave_height;out.wavePeriod=mc.wave_period;out.sst=mc.sea_surface_temperature;}
  return out;
}
function phaseOf(w){
  const t=Date.now(),sr=new Date(w.sunrise).getTime(),ss=new Date(w.sunset).getTime(),H=3600e3;

  if(f.gusty){ if(light){d-=2;} if(t.zone==="top"){d-=1;} if(INV[k].w>=40){d+=1;r.push("gusty: heavy lure casts straight through the gusts");} }
  if(f.rising&&SINK.includes(t.id)&&t.id!=="liftdrop"){d+=1;r.push("wind is building: fish often switch on as the sea livens up");}
  if(f.easing&&t.zone==="top"){d+=1;r.push("wind is dropping: the surface is calming down");}
  if(f.cold){ if(SLOW.includes(t.id)){d+=2;r.push("cool sea: fish want it slow and deep");} if(t.id==="burn"||t.id==="pop"){d-=1;} }
  if(f.warm&&t.zone==="top"&&f.twi){d+=1;r.push("warm sea: surface feeding at first and last light");}
  return {d,r};
}
function candidates(f){
  const out=[];
  for(const t of T) for(const k of t.lures){
    if(!avail(k).length) continue;
    let s=t.score(f)+((t.adj&&t.adj[k])?t.adj[k](f):0);
    if(f.rel==="on"&&f.windy&&WINDPENALTY(k)) s-=2;
    if(f.gale&&INV[k].w<30) s-=2;
    s+=envAdj(t,k,f).d;
    out.push({t,k,s});
  }
  return out;
}
function nextSuggestion(mode){ // mode: "next" | "follow"
  const f=feats(),last=S.cur;let list=candidates(f);
  list.forEach(o=>{const key=o.t.id+"/"+o.k,n=S.tried[key]||0;o.r=o.s-4.5*n;
    if(last){ if(mode==="follow"){ if(o.t.zone===last.t.zone)o.r+=4; if(INV[o.k].fam===INV[last.k].fam)o.r+=1; }
              else { if(o.t.zone===last.t.zone)o.r-=2.5; if(INV[o.k].fam===INV[last.k].fam)o.r-=2; if(o.t.id===last.t.id)o.r-=2; } }});
  if(mode==="follow"&&last){ // same lure, fresh colour first
    const other=avail(last.k).filter(c=>c.c!==last.col.c);
    if(other.length){const used=Object.assign({},S.used);used[last.k+"|"+last.col.c]=9;const pc=pickColour(last.k,f,used);
      return build(last.t,last.k,f,pc,["Same lure, new colour — fish were interested","Try a slower retrieve with longer pauses"]);}
  }
  list.sort((a,b)=>b.r-a.r);
  const o=list[0]; if(!o) return null;
  return build(o.t,o.k,f,pickColour(o.k,f,S.used),[]);
}
function build(t,k,f,pc,extra){
  const reasons=[...extra,...t.why(f).filter(Boolean)];
  if(pc&&pc.reason) reasons.push(pc.reason);
  if(f.rel==="on"&&f.windy&&INV[k].w>=35) reasons.push("heavy enough for the onshore wind");
  reasons.splice(extra.length,0,...envAdj(t,k,f).r);
  const s={t,k,col:pc&&pc.col,reasons:[...new Set(reasons)].slice(0,4)};
  if(INV[k].soft){ s.head=t.head==="search"?{n:"Search head 28 g",why:"rides tilted above the bottom — for scratching and snaggy shallows"}:{n:"Offshore head 40 g",why:"swims on the drop and the rise — for deeper water and lift-and-drop"}; }
  return s;
}
function takeSuggestion(s){S.cur=s;S.step++;const key=s.t.id+"/"+s.k;S.tried[key]=(S.tried[key]||0)+1;if(s.col)S.used[s.k+"|"+s.col.c]=(S.used[s.k+"|"+s.col.c]||0)+1;}

/* ================= EGING ================= */
const EGI_STEPS=[
 {title:"Snap and fall",how:["Cast and let it sink to just above the bottom (about 3 s per metre with a 3.5#). Don't let it sit on weed.","Pick up slack and lift gently once — a squid may already be on.","Two or three sharp upward snaps of the rod tip.","Let it fall on a semi-slack line for 5–8 s and watch the braid: a twitch, a stop or early slack is a squid.","Repeat 3–5 times back to your feet."]},
 {title:"Long fall",how:["Same cast and count.","One big upward sweep instead of short snaps.","Let it fall for 8–12 s — slow squid need time to commit.","Very slight tension so you feel the touch."]},
 {title:"Mid-water search",how:["Count it down only halfway to the bottom.","Three soft snaps, then a slow fall of 4–5 s.","Squid often hunt mid-water at night and around lights."]},
 {title:"Slow bottom drag",how:["Let it touch the bottom.","Drag it slowly 1 m with a side sweep, pause 5 s.","Cuttlefish and octopus love this — keep steady pressure if you feel weight."]},
 {title:"Move along",how:["Walk 10–20 m along the rocks or the harbour wall.","Fan 5 casts: left, half-left, straight, half-right, right.","Back to 'Snap and fall' on each cast."]}
];
function egiColour(f,used){
  const m=moon(),dark=f.night&&m.ill<40;
  const w={nat:0,brt:0,night:0};
  if(f.night){ if(dark){w.night+=3;w.brt+=1;} else {w.nat+=2;w.night+=1;} }
  else if(f.twi||f.cloud){w.brt+=3;w.nat+=1;}
  else {w.nat+=3;}
  if(f.murky){w.brt+=3;w.nat-=1;}
  let best=null,bs=-1e9;
  for(const col of avail("egi")){const s=col.tags.reduce((a,t)=>a+(w[t]||0),0)-3*(used["egi|"+col.c]||0)+Math.random()*.1;if(s>bs){bs=s;best=col;}}
  const why=f.night?(dark?"dark night: light colour + glow, charge it with your torch":"moonlit night: natural colour, charge the glow"):(f.twi||f.cloud)?"low light: orange or pink shows best":f.murky?"coloured water: bright colour":"bright clear day: natural colour";
  return {col:best,why};
}
function egiNext(colourChange){
  const f=feats();
  // new colour restarts the cadence cycle; otherwise move to the next cadence, new colour each full cycle
  const idx=(!S.cur||colourChange)?0:(S.egiIdx+1)%EGI_STEPS.length;
  const needColour=!S.cur||colourChange||idx===0;
  const pc=needColour?egiColour(f,S.used):{col:S.cur.col,why:S.cur.why};
  S.egiIdx=idx;S.step++;S.cur={egi:true,step:EGI_STEPS[idx],col:pc.col,why:pc.why};
  if(needColour&&pc.col)S.used["egi|"+pc.col.c]=(S.used["egi|"+pc.col.c]||0)+1;
}

  const f=feats();const cond=[PHASE[f.ph][0],COND.sky==="cloud"?"overcast":"sunny",WX?`wind ${dirName(WX.dir)} ${Math.round(WX.wind)} km/h`:"",WX&&WX.wave!=null?`waves ${WX.wave.toFixed(1)} m`:"",COND.bottom!=="?"?COND.bottom:"",COND.clarity!=="?"?COND.clarity+" water":""].filter(Boolean).join(" · ");
  store.log.push({t:Date.now(),lure,col,tech,cond,place:LOC&&LOC.name});save();
}
let tt;function toast(msg,bad){clearTimeout(tt);let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;el.style.background=bad?"var(--bad)":"var(--good)";tt=setTimeout(()=>el.remove(),3200);}
let lock=null;async function wake(){try{lock=await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S)wake();});

/* routes needing the extra view */
const _rr=rerender;rerender=function(){if(view==="setup2")return vSetup2();_rr();};

/* boot */
renderWX();show("home");
if(LOC)loadWX();
locate(false);
setInterval(()=>{if(LOC&&document.visibilityState==="visible")loadWX();},15*60*1000);
setInterval(()=>{const before=COND.phase;autoFill();if(COND.phase!==before&&before){renderWX();toast(`It's ${PHASE[COND.phase][0].toLowerCase()} now — next suggestions switch to ${PHASE[COND.phase][0].toLowerCase()} lures and colours`);if(view==="setup"||view==="setup2"||view==="egisetup")rerender();}},60*1000);
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
